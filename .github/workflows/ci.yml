name: CI

# [REVIEW REQUIRED] Written against this repo's actual scripts/docker-compose
# setup but not yet exercised against a live GitHub Actions run (no CI
# access in the environment this was built in) — watch the first few runs
# closely. Lighthouse CI is deliberately NOT duplicated here — it's its own
# workflow (.github/workflows/lighthouse.yml) that already triggers on the
# same events; branch protection should list both as required checks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable keys for this ephemeral CI-only Postgres/Garage — never real secrets.
  DATABASE_URL: postgres://mwezicare:mwezicare@localhost:5432/mwezicare
  AUTH_SECRET: ci-dev-secret-not-for-real-use-0000000000000000
  AI_GATEWAY_API_KEY: ci-placeholder
  ENCRYPTION_KEYS: '{"1":"5Gr+4GFjDZ7IwTr+jgZib51Dh6BzsswL7q99Tp0uOqE="}'
  ENCRYPTION_KEY_ID: "1"
  HMAC_LOOKUP_KEY: sxz8DbRsd/4ORIPMZmKuu/plyHj4HYoaLt5sFKmlA8w=
  ANALYTICS_KEY: m19j2Dnxq8cdxkTQMaUwHCZKtlTOwhJ7CpceehRP0Q0=
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: GK5eb64026e220127625db8902
  S3_SECRET_KEY: 57be0cdd2ca907f9d91ca8c1e74f63f4bfdf210ebd61cf2c0a7ab0b353bb6d30
  S3_BUCKET: mwezicare-summaries
  S3_REGION: garage
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Fixes docker-compose's project name regardless of the checkout directory
  # name, since infra/garage/bootstrap.sh's container-name default assumes it.
  COMPOSE_PROJECT_NAME: mwezicareai

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Postgres (PostGIS/pgvector/pg_trgm — see infra/postgres) and Garage
        run: docker compose up -d --build postgres garage

      - name: Wait for Postgres to be healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q postgres)" 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres did not become healthy in time" >&2
          exit 1

      - name: Run migrations
        run: pnpm db:migrate

      - name: Bootstrap Garage (bucket + access key for object-storage tests)
        run: pnpm storage:init

      # Runs every package's `vitest run` via turbo — unit tests, the
      # describe.skipIf(!db) integration tests (real against the Postgres
      # above), the new testcontainers tests (build their own Postgres
      # container via the Docker daemon this runner already has), the
      # rules-engine/triage fixtures, the assistant safety tests, and the
      # i18n parity test — all "already part of pnpm test" per the F2 spec.
      - name: Unit + integration tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Postgres and Garage
        run: docker compose up -d --build postgres garage

      - name: Wait for Postgres to be healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q postgres)" 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres did not become healthy in time" >&2
          exit 1

      - run: pnpm db:migrate
      - run: pnpm storage:init

      - name: Install Playwright's browser
        run: pnpm --filter @mwezicare/web exec playwright install --with-deps chromium

      # Runs every spec in apps/web/e2e/** on the Pixel 5 ("mobile-chrome")
      # project — the critical user journey (sign up through account
      # deletion) plus the staff journeys (ruleset approval, facility
      # verification), each already an independent spec file.
      - name: Playwright e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
